# ghvanhalen_functions.toml - Manual corrections for the analyzer (default.xex): functions it missed, [[switch_tables]] the
# codegen mistranslates and [[midasm_hook]]s into src/. KameoRecomp's kameo_functions.toml, POTCAWERecomp's
# potcawe_functions.toml and GRAWRecomp's yeti_functions.toml have examples of each.

# The C runtime's setjmp and longjmp (sub_82541C40 saves f14-f31, r13-r31, v64-v127, r1, LR and CR in the jmp_buf;
# sub_82541700 unwinds to it and loads them back), the same code as in KameoRecomp. The codegen turns calls to them
# into the host's setjmp and longjmp, keyed by the guest jmp_buf; translated as plain functions, longjmp would load
# the registers and return to its caller instead of jumping. Only the image decoders use them: libjpeg
# (sub_821F1110: setjmp at its error manager + 144, where its error function sub_821F01C0 longjmps back) and libpng
# (sub_821F1330, sub_82204CE8: setjmp at the start of the png struct, longjmp from sub_82202F60 and sub_821F0288).
setjmp_address = 0x82541C40
longjmp_address = 0x82541700

# Codegen: the registers no call passes on are local variables of each function, not fields of the PPCContext, so
# the compiler keeps them in host registers and the __savegprlr/__restgprlr helpers are elided, as in KameoRecomp,
# GRAWRecomp and POTCAWERecomp. non_argument_as_local (r0, r2, r11, r12) stays off: the SEH funclets read r12, which
# the SDK does not pass them. The non-volatile vector registers stay in the context (SDK change 42): this game's
# compiler passes values to its callees in them, outside the calling convention. sub_826B51A8, sub_826B6C70 and
# sub_826B8E20 set v92 (vor128 v92,v12,v12) and call sub_826B4B08, whose callees sub_826BCBB8, sub_826BCEA0 and
# sub_826BD2E0 read it without writing it (vmsum4fp128 v23,v92,v24); as local variables v92 would be unset there.
non_volatile_as_local = true
non_volatile_vectors_as_local = false
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true

[functions]
# The functions that call setjmp keep their registers in the context (share_registers): the host longjmp returns
# into their C++ frame, and the codegen restores the context it saved at the setjmp, not local variables. The guest
# longjmp loaded r14-r31 with their values at the setjmp. None of them calls longjmp itself, so their ends (from
# .pdata) do not move.
0x821F1110 = { share_registers = true }   # libjpeg's guard
0x821F1330 = { share_registers = true }   # libpng's guards
0x82204CE8 = { share_registers = true }
# Branch (b) targets that the automatic analysis did not assign to any function. All are small functions
# reached only through tail calls, each right after an unconditional end (b, bctr, blr): virtual call thunks
# (lwz r11,0(r3) / lwz r10,N(r11) / mtctr / bctr), a byte setter, a null check before a tail call and a
# one-instruction thunk.
0x82239DC0 = {}   # branched to from 0x8223FE84 (addi r3,r3,-4; b: an adjusted-this thunk)
0x8223FE98 = {}   # branched to from 0x82240264 (b 0x8223FB18, a one-instruction thunk)
0x8239D6F0 = {}   # branched to from 0x823D96FC (virtual call thunk, slot 108)
0x8239D780 = {}   # branched to from 0x823D9924 (virtual call thunk, slot 156)
0x8248D3D8 = {}   # branched to from 0x82345568 and 0x8234554C (sets the byte at +241)
0x826A0BD0 = {}   # branched to from 0x8257ECA8 (null check, then b 0x825452E0)

# The game's threads wait without spinning (src/thread_waits.cpp): four loops checked a condition again and
# again and kept a core at 100 % each (the three job workers, the main thread at the start of a frame and while
# it waits for the render thread, the render thread waiting for the vertical blank). Each hook spins briefly and then sleeps between checks;
# ghvanhalen_wait_sleep_us = 0 disables them. With ghvanhalen_wait_smart (on) the workers block on the job event,
# the render thread sleeps until shortly before the vertical blank, and the main thread waiting for a job group
# (sub_822CC700) watches the group's count between passes instead of taking the queue's lock again at once.
[[midasm_hook]]
address = 0x8243AF98   # li r4,0 (sub_8243AF38: a job worker with an empty queue, before WaitForSingleObject(event, 0))
name = "GHVanHalenJobWaitHook"
[[midasm_hook]]
address = 0x822F6488   # cmplwi cr6,r3,0 (sub_822F6410: while (sub_824518D0(0x82C32868) != 0) {})
name = "GHVanHalenFrameWaitHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x822F2ACC   # cmplw cr6,r11,r10 (sub_822F2A98: while (frames[24] == frames[20]) {}, waiting for the render thread)
name = "GHVanHalenRenderWaitHook"
registers = ["r11", "r10"]
[[midasm_hook]]
address = 0x82431D6C   # cmpld cr6,r3,r11 (sub_82431C58: until the vertical blank counter reaches the next value)
name = "GHVanHalenVblankWaitHook"
registers = ["r3", "r11"]
[[midasm_hook]]
address = 0x82431EB4   # cmpld cr6,r3,r30 (sub_82431C58: until the other counter reaches the frame's last vertical blank)
name = "GHVanHalenVblankWait2Hook"
registers = ["r3", "r30"]
[[midasm_hook]]
address = 0x822CC774   # lwz r11,20(r29) (sub_822CC700: the main thread waiting for a job group, after a pass)
name = "GHVanHalenJobGroupWaitHook"
registers = ["r29", "r30"]
# The D3D library's six waits for the GPU (fences, the present, ...) call sub_821D7378 for every check: at 120 FPS
# the render thread spent half its time there.
[[midasm_hook]]
address = 0x821D7378   # mflr r12 (entry of sub_821D7378: a check of a wait for the GPU, its condition still false)
name = "GHVanHalenGpuWaitHook"

# Songs in sync with their audio (src/timer.cpp): the engine's timer replaces the 50,000,000 Hz that
# KeQueryPerformanceFrequency reports by the original console's real timebase rate, 49,875,000; the SDK's timebase
# runs at 50 MHz, so the game's clock ran 0.25 % fast and the notes drifted ahead of the audio.
# ghvanhalen_timer_fix = false disables it.
[[midasm_hook]]
address = 0x822E2CF8   # cmplw cr6,r11,r6 (sub_822E2C58: r11 = the reported frequency, r6 = 50,000,000)
name = "GHVanHalenTimerFrequencyHook"
registers = ["r6"]


# Quitting from the title screen and the main menu (src/quit_prompt.cpp): once per frame, the hook looks the screens'
# own elements up in the game's element table and offers the SDK's quit prompt (B) while one exists.
[[midasm_hook]]
address = 0x822F647C   # stfd f0,2688(r7) (sub_822F6410: the main thread's frame, before its wait)
name = "GHVanHalenQuitPromptHook"

# Ultrawide (src/widescreen.cpp), with ghvanhalen_ultrawide: the projection of every 16:9 view is widened (Hor+: the
# 3D views see more at the sides; their aspect ratio is the view's size, not the SetScreen aspect), and the screen
# elements' vertices (pixels of the 1280x720 canvas) are narrowed around the center just before they are drawn to the
# screen (the menus, the HUD, the note highway and its notes stay 16:9), with the clip windows they draw through.
[[midasm_hook]]
address = 0x823688F8   # entry of sub_823688F8, a perspective projection from its frustum (f1-f4: left, right, bottom, top)
name = "GHVanHalenFrustumHook"
registers = ["f1", "f2", "f3", "f4"]
[[midasm_hook]]
address = 0x82437190   # bl DrawVerticesUP in sub_82436F78 (a sprite's quad: r6 = its vertices, r7 = their stride)
name = "GHVanHalenSpriteHook"
registers = ["r6", "r7"]
[[midasm_hook]]
address = 0x8247ACD0   # bl DrawVerticesUP in sub_8247A7E0 (another element's quad: the loading screen's layers)
name = "GHVanHalenElementQuadHook"
registers = ["r6", "r7"]
[[midasm_hook]]
address = 0x82469F70   # bl DrawVerticesUP in sub_82469E98 (a batch of quads: r5 = vertices, r6 = data, r7 = stride)
name = "GHVanHalenSpriteBatchHook"
registers = ["r5", "r6", "r7"]
[[midasm_hook]]
address = 0x82435F9C   # bl SetScissorRect in sub_82435E38 (a screen element's clip window: r4 = {x1, y1, x2, y2})
name = "GHVanHalenClipWindowHook"
registers = ["r4"]
[[midasm_hook]]
address = 0x821C73AC   # bl DrawVerticesUP in sub_821C68E8 (a sustained note's tail: r5 = vertices, r6 = data, r7 = stride)
name = "GHVanHalenTailHook"
registers = ["r5", "r6", "r7"]
[[midasm_hook]]
address = 0x821C4DD0   # bl EndVertices in sub_821C4810 (a sprite drawn as a grid of quads, the highway's board: r3 = device)
name = "GHVanHalenMeshSpriteHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x821C947C   # bl DrawVerticesUP in sub_821C9330 (a 2D particle's quad: r5 = vertices, r6 = data, r7 = stride)
name = "GHVanHalenParticleHook"
registers = ["r5", "r6", "r7"]


# Frame rates above 60 (src/framerate.cpp, ghvanhalen_frame_rate_fix): the engine's clocks counted in vertical blanks
# divide by its vertical blanks per second (the global 0x82858EE8, 60): the divisions use it times the emulated
# vblank's rate over 60, so those clocks keep their speed (no visible case known).
[[midasm_hook]]
address = 0x824C7188   # extsw r8,r30 (sub_824C7020: a vblank clock's vblanks into seconds, r30 = vblanks per second)
name = "GHVanHalenVblankClockHook"
registers = ["r30"]
[[midasm_hook]]
address = 0x824C7410   # extsw r11,r30 (sub_824C7020: seconds back into vblanks, r30 = vblanks per second)
name = "GHVanHalenVblankClockHook"
registers = ["r30"]
[[midasm_hook]]
address = 0x822E2AA0   # extsw r5,r10 (sub_822E2A80: the frame's vblanks into its time, r10 = vblanks per second)
name = "GHVanHalenVblankFrameTimeHook"
registers = ["r10"]
# Script waits counted in game frames ("Wait N gameframes"): above 60 Hz they last the console's N / 60 s.
[[midasm_hook]]
address = 0x8243F468   # entry of sub_8243F468 (a type 1 game-frame wait set: r3 = the wait, r4 = N)
name = "GHVanHalenFrameWaitSetHook"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x8243F418   # entry of sub_8243F418 (a type 8 game-frame wait set: r3 = the wait, r4 = N)
name = "GHVanHalenFrameWaitSetHook"
registers = ["r3", "r4"]
[[midasm_hook]]
address = 0x8243F7AC   # addi r11,r11,-1 (sub_8243F768: a game-frame wait's count above 0, r3 = the wait)
name = "GHVanHalenFrameWaitCountHook"
registers = ["r3", "r11"]
# Button presses polled by scripts (ControllerMake) last one frame: a script whose waits are held above 60 Hz is given
# the presses of the frames it skipped.
[[midasm_hook]]
address = 0x823AE3DC   # bgt cr6 (sub_823AE218: a controller's input state updated, r30 = the state, r9 = the pressed bits)
name = "GHVanHalenInputUpdateHook"
registers = ["r30", "r9"]
[[midasm_hook]]
address = 0x823C97D8   # entry of sub_823C97D8 (the script function ControllerMake: r4 = the script)
name = "GHVanHalenButtonPollHook"
registers = ["r4"]
[[midasm_hook]]
address = 0x823C9898   # addi r1,r1,112 (sub_823C97D8's exit, every path)
name = "GHVanHalenButtonPollEndHook"
# The whammy on a sustain is told by the frame (the bar's movement since the previous frame, a countdown of 5 frames,
# 5 frames in a row to turn a star power sustain blue or back): above 60 Hz over a 60th of a second and 5 / 60 s.
[[midasm_hook]]
address = 0x82148478   # mflr r12 (sub_82148478: a player's update in a song, every frame; src/keyboard.cpp)
name = "GHVanHalenSongFrameHook"
[[midasm_hook]]
address = 0x82153CF8   # fsubs f13,f30,f13 (sub_82153B88, a guitar: the bar's position minus the previous frame's)
name = "GHVanHalenWhammyHook"
registers = ["r30", "f30", "f13"]
[[midasm_hook]]
address = 0x82153DF4   # fsubs f12,f30,f0 (sub_82153B88, another controller: the first axis minus the previous frame's)
name = "GHVanHalenWhammyHook"
registers = ["r30", "f30", "f0"]
[[midasm_hook]]
address = 0x82153E08   # fsubs f0,f29,f0 (sub_82153B88, another controller: the second axis minus the previous frame's)
name = "GHVanHalenWhammy2Hook"
registers = ["r30", "f29", "f0"]
[[midasm_hook]]
address = 0x82156C74   # fsubs f13,f0,f13 (sub_82156AF8, the touch strip: its position minus the previous frame's)
name = "GHVanHalenWhammyHook"
registers = ["r31", "f0", "f13"]
[[midasm_hook]]
address = 0x82153D28   # stwx r10,r30,r8 (sub_82153B88: the whammy countdown, 5 frames)
name = "GHVanHalenWhammyCountdownHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x82153E28   # lfs f13,11280(r8) (sub_82153B88: r10 = 5, the countdown both axes store)
name = "GHVanHalenWhammyCountdownHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x82156CA0   # stwx r9,r31,r8 (sub_82156AF8: the whammy countdown, 5 frames)
name = "GHVanHalenWhammyCountdownHook"
registers = ["r9"]
[[midasm_hook]]
address = 0x82156ED8   # cmpwi cr6,r11,5 (sub_82156CD8: frames in a row of whammying)
name = "GHVanHalenWhammyStateHook"
registers = ["r11"]
[[midasm_hook]]
address = 0x82156FB4   # cmpwi cr6,r11,5 (sub_82156CD8: frames in a row of not whammying)
name = "GHVanHalenWhammyStateHook"
registers = ["r11"]
# The loading screen's animations step by the frame: above 60 Hz the steps are scaled by 60 / the rate.
[[midasm_hook]]
address = 0x824D561C   # after lfd f31,4208(r10) (sub_824D5508: the boot's spinning star, f31 = its turn each frame, 0.06 radians)
name = "GHVanHalenLoadingStarHook"
registers = ["f31"]
[[midasm_hook]]
address = 0x8240DAEC   # add r11,r10,r11 (sub_8240DAA0: DisplayLoadingScreen's icon, its angle plus its step, r10 = the step in degrees)
name = "GHVanHalenLoadingSpinnerHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x824D5AA8   # fadds f0,f0,f29 (sub_824D5880's mode 2: a wave's phase plus its step, f29)
name = "GHVanHalenLoadingWaveHook"
registers = ["f29"]
[[midasm_hook]]
address = 0x824D5AB8   # fadds f0,f13,f0 (sub_824D5880's mode 2: the other phase plus its step, f0)
name = "GHVanHalenLoadingWaveHook"
registers = ["f0"]
[[midasm_hook]]
address = 0x823A574C   # bne cr6 (sub_823A5518, the script function Wait, its seconds branch): r4 = the wait in ms, r30 = the script; src/crowd.cpp
name = "GHVanHalenCrowdBeatWaitHook"
registers = ["r4", "r30"]

# The screen effects each turned off by an option (src/screen_fx.cpp, ghvanhalen_fx_*): the effects' composite
# (sub_825311C8) picks its shader variant and sets each effect's constants by a mask, one bit per effect.
[[midasm_hook]]
address = 0x825313F0   # mr r11,r24 (sub_825311C8), after lwz r31,12(r25): r31 = the effects' mask
name = "GHVanHalenScreenFxMaskHook"
registers = ["r31"]
